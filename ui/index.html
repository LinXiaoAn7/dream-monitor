<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到梦空间 · 活动看板</title>
<link rel="stylesheet" href="/app.css?v=2.2.1">
</head>
<body>
<div class="shell">

  <!-- ================= 左栏 ================= -->
  <nav class="rail" id="rail" aria-label="主导航">
    <div class="rail-logo" title="到梦空间">梦</div>

    <button class="rail-item is-on" data-v="board" type="button" title="活动" aria-label="活动">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/>
      </svg>
    </button>

    <button class="rail-item" data-v="mine" type="button" title="我的活动" aria-label="我的活动">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M5 12.5l4.2 4.2L19 7"/>
      </svg>
    </button>

    <button class="rail-item" data-v="auto" type="button" title="定时报名" aria-label="定时报名">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 1.8"/>
      </svg>
    </button>

    <button class="rail-item" data-v="score" type="button" title="积分" aria-label="积分">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 3.4l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.8 6.7 19.6l1.1-5.9L3.5 9.6l5.9-.8z"/>
      </svg>
    </button>

    <div class="rail-foot">
      <div class="avatar-wrap">
        <button class="avatar" id="avatar-btn" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-label="账户">
          <img class="avatar-img" id="avatar-img" alt="" hidden>
          <span class="avatar-fallback" id="avatar-fb">—</span>
        </button>
        <div class="avatar-menu" id="avatar-menu" role="menu" hidden>
          <button class="menu-item" id="refresh" type="button" role="menuitem">刷新活动</button>
          <button class="menu-item" id="menu-logout" type="button" role="menuitem">退出登录</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ================= 主区 ================= -->
  <div class="main">
    <header class="topbar">
      <div class="brand">
        <h1 class="title" id="pageTitle">活动</h1>
        <span class="brand-sub" id="brand-sub">活动看板 <b class="brand-by">by 林小安</b></span>
      </div>
      <div class="topbar-right">
        <span class="stamp" id="stamp">尚未同步</span>
        <div class="tabs" id="tabs" role="tablist">
          <button class="tab is-on" data-f="all" type="button" role="tab">全部 <b id="c-all">0</b></button>
          <button class="tab" data-f="open" type="button" role="tab">可报名 <b id="c-open">0</b></button>
          <button class="tab" data-f="soon" type="button" role="tab">未开始 <b id="c-soon">0</b></button>
        </div>
      </div>
    </header>

    <!-- 登录失效提示 -->
    <div class="notice" id="notice" hidden>
      <span class="notice-ico" aria-hidden="true">!</span>
      <p class="notice-text" id="notice-text"></p>
      <button class="btn btn--solid btn--sm" id="notice-act" type="button">重新登录</button>
    </div>

    <div class="scroll">
      <!-- ---------------- 活动 ---------------- -->
      <section class="view" id="v-board">
        <div class="metrics">
          <div class="metric">
            <span class="metric-k">可报名</span>
            <b class="metric-v is-accent" id="m-open">0</b>
          </div>
          <div class="metric">
            <span class="metric-k">即将开始</span>
            <b class="metric-v" id="m-soon">0</b>
          </div>
          <div class="metric">
            <span class="metric-k">进行中</span>
            <b class="metric-v" id="m-run">0</b>
          </div>
          <div class="gauge" aria-hidden="true">
            <i class="gauge-seg g-open" id="g-open"></i>
            <i class="gauge-seg g-soon" id="g-soon"></i>
            <i class="gauge-seg g-run" id="g-run"></i>
          </div>
        </div>
        <div class="rows" id="stream"></div>
      </section>

      <!-- ---------------- 我的活动 ---------------- -->
      <section class="view" id="v-mine" hidden>
        <p class="view-note" id="mine-who"></p>
        <div class="rows" id="mine-list"></div>
      </section>

      <!-- ---------------- 定时报名 ---------------- -->
      <section class="view" id="v-auto" hidden>
        <p class="view-note" id="auto-note">到点由服务器自动报名，浏览器关掉也会执行。</p>
        <div class="rows" id="auto-list"></div>
      </section>

      <!-- ---------------- 积分 ---------------- -->
      <section class="view" id="v-score" hidden>
        <p class="view-note" id="sc-who"></p>
        <div class="score-block">
          <span class="metric-k">到梦空间积分</span>
          <div class="score-v"><b id="sc-score">…</b><small>分</small></div>
          <p class="score-cap" id="sc-cap"></p>
          <div class="score-actions">
            <button class="btn btn--ghost" id="sc-rescan" type="button">重新统计</button>
            <button class="btn btn--ghost" id="sc-logout" type="button">退出登录</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- ================= 详情抽屉 ================= -->
<div class="scrim" id="scrim"></div>
<aside class="panel" id="drawer" aria-hidden="true" aria-label="活动详情">
  <div class="panel-head">
    <span class="panel-cap">活动详情</span>
    <button class="panel-x" id="drawer-close" type="button" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div class="panel-body">
    <h2 class="panel-title" id="d-title">读取中…</h2>
    <div class="kv" id="d-body"></div>
  </div>
</aside>

<!-- ================= 进度遮罩 ================= -->
<div class="pbar" id="pbar" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="pbar-card">
    <span class="pbar-cap">正在抓取</span>
    <div class="pbar-track"><div class="pbar-fill" id="pbar-fill"></div></div>
    <span class="pbar-txt" id="pbar-txt">准备中…</span>
  </div>
</div>

<!-- ================= 轻提示 ================= -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ================= 确认框 ================= -->
<dialog class="confirm" id="confirm">
  <h2 class="confirm-title" id="confirm-title">确认操作？</h2>
  <p class="confirm-text" id="confirm-text"></p>
  <div class="confirm-actions">
    <button class="btn btn--ghost" id="confirm-no" type="button">取消</button>
    <button class="btn btn--solid" id="confirm-yes" type="button">确认</button>
  </div>
</dialog>

<noscript><p style="padding:24px;color:#A8B0BB">这个看板需要 JavaScript。</p></noscript>
<script src="/app.js?v=2.2.1"></script>
</body>
</html>
