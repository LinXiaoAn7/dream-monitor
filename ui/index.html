<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到梦空间 · 活动看板</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="brand">
      <span class="brand-mark">到梦空间</span>
      <span class="brand-sub" id="brand-sub">活动看板</span>
    </div>
    <div class="mast-actions">
      <span class="stamp" id="stamp">尚未同步</span>
      <div class="avatar-wrap">
        <button class="avatar" id="avatar-btn" type="button"
                aria-haspopup="menu" aria-expanded="false" title="账号">
          <img class="avatar-img" id="avatar-img" alt="" hidden>
          <span class="avatar-fallback" id="avatar-fb">—</span>
        </button>
        <div class="avatar-menu" id="avatar-menu" role="menu" hidden>
          <button class="menu-item" id="refresh" type="button" role="menuitem">刷新活动</button>
          <button class="menu-item" id="menu-logout" type="button" role="menuitem">退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="主导航">
      <button class="rail-item is-on" data-v="board" type="button">活动</button>
      <button class="rail-item" data-v="score" type="button">积分</button>
    </nav>

    <div class="pane">

      <section class="view" id="v-board">
        <div class="notice" id="notice" hidden>
          <span class="notice-mark">!</span>
          <span class="notice-text" id="notice-text"></span>
          <button class="btn btn--solid btn--sm" id="notice-act" type="button">重新登录</button>
        </div>

        <section class="board" aria-label="统计">
          <div class="metric metric--hot">
            <span class="m-label">可报名</span>
            <b class="m-num" id="m-open">0</b>
            <span class="m-cap">名额未满且开放中</span>
          </div>
          <div class="metric">
            <span class="m-label">即将开始</span>
            <b class="m-num" id="m-soon">0</b>
            <span class="m-cap">报名尚未开启</span>
          </div>
          <div class="metric">
            <span class="m-label">进行中</span>
            <b class="m-num" id="m-run">0</b>
            <span class="m-cap">活动已开始</span>
          </div>
          <div class="metric metric--note">
            <span class="m-label">说明</span>
            <p class="m-text">仅显示可报名 / 即将开始 / 进行中的校内活动，已结束的不列出。数据来自 App 本校列表，点任意一条看完整详情。</p>
          </div>

          <div class="gauge">
            <span class="gauge-title">状态分布</span>
            <div class="gauge-bar" role="img" aria-label="状态分布">
              <i class="gauge-seg gauge-seg--open" id="g-open"></i>
              <i class="gauge-seg gauge-seg--soon" id="g-soon"></i>
              <i class="gauge-seg gauge-seg--run" id="g-run"></i>
            </div>
            <ul class="gauge-legend">
              <li><i class="dot dot--open"></i>可报名</li>
              <li><i class="dot dot--soon"></i>即将开始</li>
              <li><i class="dot dot--run"></i>进行中</li>
            </ul>
          </div>
        </section>

        <nav class="tabs" id="tabs">
          <button class="tab is-on" data-f="all" type="button">全部<b id="c-all">0</b></button>
          <button class="tab" data-f="open" type="button">可报名<b id="c-open">0</b></button>
          <button class="tab" data-f="soon" type="button">即将开始<b id="c-soon">0</b></button>
        </nav>

        <main class="stream" id="stream">
          <div class="empty" id="empty">加载中…</div>
        </main>

      </section>

      <section class="view" id="v-score" hidden>
        <h1 class="page-title">我的积分</h1>
        <p class="score-who" id="sc-who"></p>

        <div class="score-hero">
          <span class="score-label">到梦空间积分</span>
          <div class="score-num">
            <b id="sc-score">—</b>
            <span>分</span>
          </div>
          <p class="score-cap" id="sc-cap">正在读取…</p>
        </div>

        <div class="score-actions">
          <button class="btn btn--solid btn--sm" id="sc-rescan" type="button">重新统计</button>
          <button class="btn btn--ghost btn--sm" id="sc-logout" type="button">退出登录</button>
        </div>
      </section>

    </div>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-kicker">活动详情</span>
      <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">✕</button>
    </div>
    <h2 class="drawer-title" id="d-title">—</h2>
    <div class="drawer-body" id="d-body"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="pbar" id="pbar" hidden role="progressbar" aria-live="polite"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="pbar-box">
      <span class="pbar-kicker">正在抓取</span>
      <div class="pbar-track"><div class="pbar-fill" id="pbar-fill"></div></div>
      <span class="pbar-txt" id="pbar-txt">准备中…</span>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
