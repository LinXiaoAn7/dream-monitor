<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到梦空间 · 活动看板</title>
<link rel="stylesheet" href="/app.css?v=2.1.1">
</head>
<body>
<div class="app app--narrow">

  <header class="masthead">
    <div class="brand">
      <span class="brand-mark">到梦空间</span>
      <span class="brand-sub">活动看板</span>
    </div>
  </header>

  <section class="auth">
    <h1 class="auth-title">账号登录</h1>

    <form class="auth-form" id="form" autocomplete="on" novalidate
        onsubmit="return false;">
      <label class="field">
        <span class="field-label">手机号</span>
        <input class="field-input" id="account" name="account" type="tel"
               inputmode="numeric" autocomplete="username" required>
      </label>

      <label class="field">
        <span class="field-label">密码</span>
        <input class="field-input" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </label>

      <p class="auth-hint" id="hint" hidden></p>

      <div class="auth-actions">
        <button class="btn btn--solid auth-submit" id="submit" type="submit">登录</button>
      </div>
    </form>
      <noscript><p class="auth-hint" data-kind="error">这个页面需要 JavaScript，请换用 Chrome / Edge / Safari 打开。</p></noscript>
  </section>

</div>
<script src="/login.js?v=2.1.1"></script>
</body>
</html>
